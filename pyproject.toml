[project]
name = "repo-auditor"
version = "0.1.0"
description = "Windows-native Streamlit app for repository auditing"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.11"


dependencies = [
    "streamlit>=1.40.0",
    "gitpython>=3.1.40",
    "openai>=1.50.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "pandas>=3.0.6",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
