[project]
name = "repo-auditor"
version = "0.1.0"
description = "Windows-native Streamlit app for repository auditing"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.11"


dependencies = [
    "streamlit>=1.40.0",
    "gitpython>=3.1.40",
    "pathspec>=0.12.0",
    "openai>=1.50.0",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
